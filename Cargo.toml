[package]
name = "trace-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A bounded-memory event index for agent trace JSONL files"
license = "MIT"
repository = "https://github.com/wangyuxinwhy/trace-index"
homepage = "https://wangyuxinwhy.github.io/trace-index/"
documentation = "https://wangyuxinwhy.github.io/trace-index/"
readme = "README.md"
keywords = ["agent", "trace", "jsonl", "sqlite", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/docs/**",
    "/.agents/skills/trace-index/SKILL.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]
publish = ["crates-io"]

[[bin]]
name = "trace-index"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
blake3 = "1.8.5"
clap = { version = "4.6.2", features = ["derive"] }
rusqlite = { version = "0.40.1", features = ["bundled", "functions", "hooks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
tree-sitter = "=0.26.11"
tree-sitter-bash = "=0.25.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
