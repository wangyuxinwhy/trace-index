name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install declared Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --all-targets --locked
      - name: Check minimum supported Rust version
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 check --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked
      - name: Verify crates.io package
        env:
          CARGO_TARGET_DIR: target/package-verify
        run: cargo package --locked

  python:
    name: Native Python (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build tools
        run: python -m pip install 'maturin>=1.9,<2' mypy
      - name: Check native workspace
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
      - name: Check native minimum Rust version
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 check --workspace --all-targets --locked
      - name: Check generated Python declarations
        run: python scripts/generate_python_stubs.py --check
      - name: Build native wheel and CLI
        run: |
          maturin build --release --locked --manifest-path python/Cargo.toml
          cargo build --locked
      - name: Install wheel and validate public API
        run: |
          python -m pip install --no-index --find-links target/wheels trace-index
          python -m mypy.stubtest trace_index
          TRACE_INDEX_CLI="$PWD/target/debug/trace-index" python -m unittest discover -s python/tests -v
      - name: Verify source distribution round trip
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        run: |
          maturin sdist --manifest-path python/Cargo.toml
          python -m pip wheel --no-deps --wheel-dir target/sdist-wheels target/wheels/*.tar.gz
          python -m pip install --force-reinstall --no-index --find-links target/sdist-wheels trace-index
          TRACE_INDEX_CLI="$PWD/target/debug/trace-index" python -m unittest discover -s python/tests -v

  docs:
    name: Public documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:check
