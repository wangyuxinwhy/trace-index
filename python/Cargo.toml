[package]
name = "trace-index-python"
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Native Python bindings for Trace Index"
license = "MIT"
repository = "https://github.com/wangyuxinwhy/trace-index"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
trace-index = { path = ".." }
anyhow = "1.0"
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pythonize = "0.29.0"

[lints.clippy]
all = "deny"
